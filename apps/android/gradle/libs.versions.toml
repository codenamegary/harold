harold-android-application = { id = "harold.android.application" }
harold-android-library = { id = "harold.android.library" }
harold-android-compose = { id = "harold.android.compose" }
harold-android-feature = { id = "harold.android.feature" }
harold-android-hilt = { id = "harold.android.hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
