name: publish-cli

# Builds and publishes the npm package via trusted publishing. Called by
# the Release Please workflow whenever a release is created (merging the
# release PR is what publishes), and dispatchable by hand for recovery
# runs. The npm side trusts this exact workflow filename — see
# docs.npmjs.com/trusted-publishers.
#
# Trusted publishing needs no NPM_TOKEN secret: the publish job exchanges
# the workflow's OIDC token for short-lived credentials, and npm attaches
# the provenance attestation automatically.
#
# Careful with manual dispatch: the tag's version is what ships.
# Dispatching v1.0.2 publishes @codenamegary/harold@1.0.2 for real.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example v1.0.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v1.0.2)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm package
        run: bun run build:npm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish
        run: npm publish apps/cli/dist --access public

      # Done-when check from #323: the published bin runs on a clean
      # machine. The scratch dir has no repo, so npx resolves the package
      # from the registry. npm accepts publishes asynchronously ("may take
      # a few minutes to become available"), so poll before the check.
      - name: Smoke test the published bin
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#harold-}"
          VERSION="${VERSION#v}"
          for attempt in $(seq 1 30); do
            if npm view "@codenamegary/harold@$VERSION" version >/dev/null 2>&1; then
              echo "available after $((attempt * 10))s"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "@codenamegary/harold@$VERSION never became available" >&2
              exit 1
            fi
            sleep 10
          done
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          OUTPUT="$(npx --yes @codenamegary/harold@"$VERSION" --version)"
          echo "npx reported: $OUTPUT"
          [ "$OUTPUT" = "$VERSION" ]
