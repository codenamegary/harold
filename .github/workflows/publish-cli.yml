# Trusted publishing: no NPM_TOKEN secret. The publish job exchanges the
# workflow's OIDC token (id-token: write) for a short-lived publish
# credential, and npm attaches provenance automatically. The package's
# trusted publisher on npmjs.com must list this workflow's filename
# (publish-cli.yml) — see docs.npmjs.com/trusted-publishers.
name: publish-cli

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the latest harold-* release)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only the CLI component's releases (tagged `harold-vX.Y.Z`) publish to
    # npm; other tags are not CLI releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'harold-')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              TAG="${{ github.event.release.tag_name }}"
            else
              TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                --jq '[.[].tagName | select(startswith("harold-"))][0]')"
            fi
          fi
          if [ -z "$TAG" ]; then
            echo "No harold-* release found" >&2
            exit 1
          fi
          VERSION="${TAG#harold-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm package
        run: bun run build:npm

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish
        run: npm publish apps/cli/dist --access public

      # Done-when check from #323: the published bin runs on a clean
      # machine. The scratch dir has no repo, so npx resolves the package
      # from the registry.
      - name: Smoke test the published bin
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          OUTPUT="$(npx --yes @codenamegary/harold@"$VERSION" --version)"
          echo "npx reported: $OUTPUT"
          [ "$OUTPUT" = "$VERSION" ]
