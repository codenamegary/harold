name: deploy-demo-server

# Deploys the fake Harold demo server (apps/demo-server) that the app-review
# build pairs with. The VPS keeps a clone of this repo at
# /home/ubuntu/repos/harold, bind-mounted read-only into the harold-demo
# container, which runs the server from source with bun — so a deploy is just
# pull, install, restart.
#
# Triggers on the demo server itself, on the contracts package that defines
# its wire format, and on bun.lock, since dependency changes are installed by
# the deploy. Reuses the same VPS secrets as publish-demo and release-android.
on:
  push:
    branches:
      - main
    paths:
      - "apps/demo-server/**"
      - "packages/contracts/**"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, install, and restart harold-demo on the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          install -m 600 /dev/null id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > id_ed25519
          OPTS=(-i id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          trap 'rm -f id_ed25519' EXIT

          # The remote script runs against fixed paths, so it needs nothing
          # from this job beyond the ssh connection itself.
          ssh "${OPTS[@]}" "$VPS_HOST" bash <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/repos/harold
          git pull --ff-only origin main

          # bun lives in ~/.bun/bin, which ~/.bashrc only puts on PATH for
          # interactive shells, so call it by full path.
          "$HOME/.bun/bin/bun" install --frozen-lockfile

          docker restart harold-demo

          # The container healthcheck polls /healthz every 10s. Wait for it
          # to flip back to healthy before calling the deploy done, and dump
          # logs when it never does.
          status=
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' harold-demo)"
            if [ "$status" = healthy ]; then
              echo "harold-demo is healthy"
              exit 0
            fi
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "harold-demo did not become healthy (status: ${status:-unknown})"
          docker logs --tail 50 harold-demo
          exit 1
          REMOTE
