name: release-binaries

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # harold-* releases are the npm CLI component; binaries ship from
    # repo-level releases only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.release.tag_name, 'harold-')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile binaries
        run: bun run build:release

      - name: Generate checksums
        working-directory: apps/server/release
        run: sha256sum harold-* > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            apps/server/release/harold-* \
            apps/server/release/SHA256SUMS \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
