name: android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace --warning-mode=all lintRelease testDebugUnitTest assembleDebug assembleRelease

      - name: Stage APK artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            artifacts/app-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: apps/android/artifacts/
          archive: false
          if-no-files-found: error

  upload-drive:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v7
        with:
          name: android-apks
          path: apks

      - name: Stage APKs for Google Drive
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p drive-upload
          cp apks/app-debug.apk "drive-upload/${stamp}-debug-app.apk"
          cp apks/app-release-unsigned.apk "drive-upload/${stamp}-release-app.apk"

      - name: Upload APKs to Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.3.5
        with:
          target: drive-upload/*.apk
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          set_metadata: true
