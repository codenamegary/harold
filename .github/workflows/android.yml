name: android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
      - "story/**"
    paths:
      - apps/android/**
      - .github/workflows/android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace --warning-mode=all lintRelease testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs to fs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          FS_URL: ${{ secrets.FS_URL }}
          FS_USER: ${{ secrets.FS_USER }}
          FS_PASSWORD: ${{ secrets.FS_PASSWORD }}
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p staged
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "staged/${stamp}-debug-app.apk"
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "staged/${stamp}-release-app.apk"
          export LOCAL_PATH=staged
          export REMOTE_PATH=agent-server/apk
          bash .github/scripts/upload-to-fs.sh
