name: android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
      - "story/**"
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/
