name: android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace --warning-mode=all lintRelease testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Stage APKs for Google Drive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p drive-upload
          cp app/build/outputs/apk/debug/app-debug.apk \
            "drive-upload/${stamp}-debug-app.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "drive-upload/${stamp}-release-app.apk"

      - name: Upload APKs to Google Drive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.3.5
        with:
          target: apps/android/drive-upload/*.apk
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          set_metadata: true
