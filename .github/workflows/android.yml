name: android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml
      - .github/scripts/upload-to-fs.sh
  pull_request:
    branches:
      - main
      - "story/**"
    paths:
      - apps/android/**
      - .github/workflows/android.yml
      - .github/scripts/upload-to-fs.sh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest

      - name: Build debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK to fs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          FS_URL: ${{ secrets.FS_URL }}
          FS_USER: ${{ secrets.FS_USER }}
          FS_PASSWORD: ${{ secrets.FS_PASSWORD }}
          FS_KEEP_RECENT: "10"
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p staged
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "staged/${stamp}-debug-app.apk"
          export LOCAL_PATH=staged
          export REMOTE_PATH=agent-server/apk
          bash .github/scripts/upload-to-fs.sh
