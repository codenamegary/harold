name: ci

# Android and the demo server are the products in the repo, so every pull
# request and main push runs both checks. ci-ok is the single required status
# check for branch protection.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      # Enhanced caching is the default: restore keys, deduped dependencies,
      # and cleanup. Basic caching is exact-key only and discards the whole
      # Gradle home whenever a build file changes.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read Robolectric version
        id: robolectric_version
        run: |
          version="$(sed -n 's/^robolectric[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read the Robolectric version from gradle/libs.versions.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ steps.robolectric_version.outputs.version }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Android checks
        run: ./gradlew --stacktrace lintRelease testDebugUnitTest testBuildLogic

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: apps/android/**/build/test-results/testDebugUnitTest/

  store-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Play store assets
        run: python3 scripts/checks/store_assets.py

  demo-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  # The single required status check. It always runs and fails unless every
  # job reported success or was skipped.
  ci-ok:
    if: always()
    needs: [android, store-assets, demo-server]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "gate: fail (no results)"; exit 1; }
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "gate: fail ($RESULTS)"; exit 1 ;;
            esac
          done
          echo "gate: pass"
