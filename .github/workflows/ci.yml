name: ci

# Single entry point for pull request and push CI. Branch protection needs a
# status check that reports on every pull request, so no trigger here may use
# paths/paths-ignore — path filtering happens inside the `changes` job, and
# `ci-ok` is the one check that always reports. The invariants are enforced
# by scripts/checks/workflows.test.ts.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual dispatch has no meaningful diff to inspect, so it runs
      # everything; otherwise the filter step decides.
      check: ${{ steps.all.outputs.check || steps.filter.outputs.check }}
      android: ${{ steps.all.outputs.android || steps.filter.outputs.android }}
      smoke: ${{ steps.all.outputs.smoke || steps.filter.outputs.smoke }}
    steps:
      # pull requests diff via the GitHub API, push events diff git history
      # against the previous push (base defaults to the pushed branch).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # `check` relies on its `!apps/android/**` exclusion, which the
          # default `some` quantifier would silently ignore.
          predicate-quantifier: some-with-excludes
          filters: |
            check:
              - '**'
              - '!apps/android/**'
            android:
              - 'apps/android/**'
              - '.github/workflows/ci.yml'
            smoke:
              - 'apps/server/**'
              - 'packages/contracts/**'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

      - name: Run everything on manual dispatch
        id: all
        if: github.event_name == 'workflow_dispatch'
        run: |
          for name in check android smoke; do
            echo "$name=true" >> "$GITHUB_OUTPUT"
          done

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bun run lint
          bun run lint:boundaries
          bun run typecheck
          bun test scripts

      - name: Test with coverage
        id: coverage
        run: bun run test:coverage

      - name: Build HTML coverage report
        if: always() && steps.coverage.outcome == 'success'
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          # lcov source paths are relative to each package, so genhtml runs from there.
          for name in server cli; do
            mkdir -p "coverage/html/$name"
            (
              cd "apps/$name"
              genhtml "../../coverage/$name/lcov.info" \
                --output-directory "../../coverage/html/$name" \
                --title "apps/$name" \
                --legend \
                --show-details
            )
            {
              echo ""
              echo "### apps/$name"
              echo ""
              echo '```'
              lcov --summary "coverage/$name/lcov.info"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # summary.json is the machine-readable entry point for anything that
      # reads the artifact. Bump schemaVersion when its shape changes.
      - name: Write coverage summary
        if: always() && steps.coverage.outcome == 'success'
        run: |
          packages='{}'
          for name in server cli; do
            read -r lf lh fnf fnh < <(awk -F: '
              /^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
              /^FNF:/ { fnf += $2 } /^FNH:/ { fnh += $2 }
              END { print lf + 0, lh + 0, fnf + 0, fnh + 0 }
            ' "coverage/$name/lcov.info")
            packages="$(jq -c \
              --arg name "$name" \
              --argjson lf "$lf" --argjson lh "$lh" \
              --argjson fnf "$fnf" --argjson fnh "$fnh" '
              def metric($found; $hit):
                { found: $found, hit: $hit,
                  pct: (if $found > 0 then ($hit * 10000 / $found | round) / 100 else null end) };
              . + { "apps/\($name)": {
                lcov: "\($name)/lcov.info",
                html: "html/\($name)/index.html",
                lines: metric($lf; $lh),
                functions: metric($fnf; $fnh)
              } }' <<< "$packages")"
          done
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson packages "$packages" '
            {
              schemaVersion: 1,
              commit: $commit,
              ref: $ref,
              runId: $runId,
              generatedAt: $generatedAt,
              packages: $packages
            }' > coverage/summary.json
          cat coverage/summary.json

      - name: Upload coverage artifact
        id: coverage-artifact
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 90

      - name: Link coverage artifact
        if: always() && steps.coverage-artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "Full report (lcov, HTML, summary.json): [coverage artifact](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source actions/cache wrapper. The default provider is proprietary.
          cache-provider: basic

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/

  smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- -v 1.18.31
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run smoke tests
        env:
          HAROLD_RUN_SMOKE: "1"
          OPENCODE_SMOKE_MODEL: opencode/mimo-v2.5-free
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun run test:smoke

      - name: Upload opencode logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  # The single required status check. It always runs (even when jobs above
  # are skipped or failed) and fails unless every job reported success or
  # was skipped by the path filter — see scripts/ci/gate.ts.
  ci-ok:
    if: always()
    needs: [changes, check, android, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Enforce the gate
        run: bun run scripts/ci/gate.ts ${{ join(needs.*.result, ' ') }}
