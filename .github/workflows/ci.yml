name: ci

# Android is the only product in the repo, so every pull request and main
# push runs the Android checks. ci-ok is the single required status check for
# branch protection.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source actions/cache wrapper. The default provider is proprietary.
          cache-provider: basic

      - name: Android checks
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest testBuildLogic

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: apps/android/**/build/test-results/testDebugUnitTest/

  store-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Play store assets
        run: python3 scripts/checks/store_assets.py

  # The single required status check. It always runs and fails unless every
  # job reported success or was skipped.
  ci-ok:
    if: always()
    needs: [android, store-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "gate: fail (no results)"; exit 1; }
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "gate: fail ($RESULTS)"; exit 1 ;;
            esac
          done
          echo "gate: pass"
