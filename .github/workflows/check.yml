name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - apps/android/**
      - .github/workflows/android.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bun run lint
          bun run lint:boundaries
          bun run typecheck
          bun test scripts

      - name: Test with coverage
        id: coverage
        run: bun run test:coverage

      - name: Build HTML coverage report
        if: always() && steps.coverage.outcome == 'success'
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          # lcov source paths are relative to each package, so genhtml runs from there.
          for name in server cli; do
            mkdir -p "coverage/html/$name"
            (
              cd "apps/$name"
              genhtml "../../coverage/$name/lcov.info" \
                --output-directory "../../coverage/html/$name" \
                --title "apps/$name" \
                --legend \
                --show-details
            )
            {
              echo ""
              echo "### apps/$name"
              echo ""
              echo '```'
              lcov --summary "coverage/$name/lcov.info"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # summary.json is the machine-readable entry point for anything that
      # reads the artifact. Bump schemaVersion when its shape changes.
      - name: Write coverage summary
        if: always() && steps.coverage.outcome == 'success'
        run: |
          packages='{}'
          for name in server cli; do
            read -r lf lh fnf fnh < <(awk -F: '
              /^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
              /^FNF:/ { fnf += $2 } /^FNH:/ { fnh += $2 }
              END { print lf + 0, lh + 0, fnf + 0, fnh + 0 }
            ' "coverage/$name/lcov.info")
            packages="$(jq -c \
              --arg name "$name" \
              --argjson lf "$lf" --argjson lh "$lh" \
              --argjson fnf "$fnf" --argjson fnh "$fnh" '
              def metric($found; $hit):
                { found: $found, hit: $hit,
                  pct: (if $found > 0 then ($hit * 10000 / $found | round) / 100 else null end) };
              . + { "apps/\($name)": {
                lcov: "\($name)/lcov.info",
                html: "html/\($name)/index.html",
                lines: metric($lf; $lh),
                functions: metric($fnf; $fnh)
              } }' <<< "$packages")"
          done
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson packages "$packages" '
            {
              schemaVersion: 1,
              commit: $commit,
              ref: $ref,
              runId: $runId,
              generatedAt: $generatedAt,
              packages: $packages
            }' > coverage/summary.json
          cat coverage/summary.json

      - name: Upload coverage artifact
        id: coverage-artifact
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 90

      - name: Link coverage artifact
        if: always() && steps.coverage-artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "Full report (lcov, HTML, summary.json): [coverage artifact](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
