name: web

on:
  push:
    branches:
      - main
    paths-ignore:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - apps/android/**
      - .github/workflows/android.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint && bun run typecheck

      - name: Test with coverage
        id: coverage
        run: bun run test:coverage

      - name: Build HTML coverage report
        if: always() && steps.coverage.outcome == 'success'
        run: |
          mkdir -p coverage/html/server coverage/html/web
          (
            cd apps/server
            genhtml ../../coverage/server/lcov.info \
              --output-directory ../../coverage/html/server \
              --title "apps/server" \
              --legend \
              --show-details
          )
          (
            cd apps/web
            genhtml ../../coverage/web/lcov.info \
              --output-directory ../../coverage/html/web \
              --title "apps/web" \
              --legend \
              --show-details
          )
          {
            echo "## Test coverage"
            echo ""
            echo "### apps/server"
            echo ""
            echo '```'
            lcov --summary coverage/server/lcov.info
            echo '```'
            echo ""
            echo "### apps/web"
            echo ""
            echo '```'
            lcov --summary coverage/web/lcov.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to fs
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          always() && steps.coverage.outcome == 'success'
        env:
          FS_URL: ${{ secrets.FS_URL }}
          FS_USER: ${{ secrets.FS_USER }}
          FS_PASSWORD: ${{ secrets.FS_PASSWORD }}
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          zip_path="${stamp}.zip"
          (cd coverage/html && zip -qr "../../${zip_path}" .)
          export LOCAL_PATH="${zip_path}"
          export REMOTE_PATH="agent-server/coverage"
          bash .github/scripts/upload-to-fs.sh
          base="${FS_URL:-https://fs.codenamegary.com}"
          base="${base%/}"
          {
            echo "## Coverage on fs"
            echo ""
            echo "Extracted report: [\`agent-server/coverage/${stamp}/\`](${base}/agent-server/coverage/${stamp}/)"
          } >> "$GITHUB_STEP_SUMMARY"
