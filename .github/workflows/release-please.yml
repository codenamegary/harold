name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          # A PAT is required so the published release event can trigger
          # release-binaries. GitHub suppresses events created by GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
