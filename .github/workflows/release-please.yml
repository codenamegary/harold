name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      android_release_created: ${{ steps.release.outputs['apps/android--release_created'] }}
      android_tag_name: ${{ steps.release.outputs['apps/android--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT is required so CI starts on release PRs. PRs created with
          # GITHUB_TOKEN hold their runs for manual approval.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Called directly instead of on `release: published`. When release-please
  # falls back to GITHUB_TOKEN, the release it creates starts no workflows,
  # and the release would ship without an APK or Play build.
  android:
    needs: release-please
    if: needs.release-please.outputs.android_release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ needs.release-please.outputs.android_tag_name }}
      publish_to_play: true
    secrets: inherit
