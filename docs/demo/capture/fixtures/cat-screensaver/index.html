<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Screensaver</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        margin: 0;
        background: #070b12;
        color: #f4f1e8;
      }

      #screen {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #settings {
        position: fixed;
        right: 24px;
        bottom: 24px;
        display: grid;
        gap: 12px;
        padding: 18px 20px;
        border: 1px solid #2a3448;
        border-radius: 14px;
        background: rgba(8, 10, 13, 0.88);
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa7bd;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <aside id="settings" aria-label="Screensaver settings"></aside>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
